
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA | Navigation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #EDEBDD;
    --accent: #810100;
    --dark: #1B1717;
    --muted: #77716B;
    --border: rgba(27,23,23,0.13);
    --glass: rgba(237,235,221,0.78);
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--dark);
    overflow-x: hidden;
}

/* Subtle background texture */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.17;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");
}

/* NAV WRAPPER */

.nav-wrapper {
    position: fixed;
    top: 24px;
    left: 0;
    width: 100%;
    padding: 0 5%;
    z-index: 1000;
}

/* GLASS NAVBAR */

.navbar {
    max-width: 1300px;
    height: 78px;
    margin: auto;
    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: var(--glass);
    backdrop-filter: blur(22px) saturate(130%);
    -webkit-backdrop-filter: blur(22px) saturate(130%);

    border: 1px solid rgba(255,255,255,0.65);
    border-bottom-color: var(--border);
    border-radius: 18px;

    box-shadow:
        0 8px 35px rgba(27,23,23,0.055),
        inset 0 1px 0 rgba(255,255,255,0.8);

    transition: all 0.35s ease;
}

/* Scroll state */

.navbar.scrolled {
    height: 68px;
    background: rgba(237,235,221,0.94);
    box-shadow: 0 8px 30px rgba(27,23,23,0.09);
}

/* LOGO */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    color: var(--dark);
    text-decoration: none;

    font-size: 23px;
    font-weight: 800;
    letter-spacing: -1.3px;
}

.logo-icon {
    width: 37px;
    height: 37px;

    display: grid;
    place-items: center;

    background: var(--accent);
    color: var(--bg);

    border-radius: 11px;
    font-size: 21px;

    transition: 0.4s ease;
}

.logo:hover .logo-icon {
    transform: rotate(90deg);
    border-radius: 50%;
}

/* NAV LINKS */

.nav-links {
    display: flex;
    align-items: center;
    gap: 6px;
    list-style: none;
}

.nav-links a {
    position: relative;
    display: inline-block;

    padding: 12px 17px;

    color: var(--muted);
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;

    transition: color 0.3s ease;
}

/* Animated underline */

.nav-links a::after {
    content: "";
    position: absolute;

    left: 17px;
    right: 17px;
    bottom: 5px;

    height: 2px;
    background: var(--accent);

    transform: scaleX(0);
    transform-origin: left;

    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
}

.nav-links a:hover {
    color: var(--accent);
}

.nav-links a:hover::after,
.nav-links a.active::after {
    transform: scaleX(1);
}

.nav-links a.active {
    color: var(--accent);
}

/* ACTION BUTTON */

.nav-actions {
    display: flex;
    align-items: center;
    gap: 22px;
}

.login {
    color: var(--dark);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: 0.3s;
}

.login:hover {
    color: var(--accent);
}

.cta {
    display: inline-flex;
    align-items: center;
    gap: 18px;

    padding: 13px 19px;

    background: var(--accent);
    color: var(--bg);

    border: 1px solid var(--accent);
    border-radius: 9px;

    text-decoration: none;
    font-size: 12px;
    font-weight: 700;

    transition: 0.35s ease;
}

.cta span {
    transition: transform 0.3s ease;
}

.cta:hover {
    background: transparent;
    color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(129,1,0,0.12);
}

.cta:hover span {
    transform: translate(3px,-3px);
}

/* MOBILE BUTTON */

.menu-toggle {
    display: none;
    width: 42px;
    height: 42px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: transparent;
    color: var(--dark);

    font-size: 21px;
    cursor: pointer;
}

/* DEMO HERO */

.hero {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 140px 20px 70px;
    text-align: center;
}

.hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    padding: 10px 17px;

    border: 1px solid rgba(129,1,0,0.2);
    border-radius: 30px;

    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;

    margin-bottom: 30px;
}

.hero h1 {
    font-size: clamp(48px, 8vw, 100px);
    line-height: 1.05;
    letter-spacing: -5px;
    font-weight: 800;
}

.hero h1 span {
    color: var(--accent);
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-style: italic;
}

.hero p {
    max-width: 480px;
    margin-top: 25px;

    color: var(--muted);
    font-size: 15px;
    line-height: 1.9;
}

.hero-link {
    display: inline-block;
    margin-top: 35px;

    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;

    border-bottom: 1px solid var(--accent);
    padding-bottom: 6px;
}

/* RESPONSIVE */

@media(max-width: 900px) {

    .nav-wrapper {
        padding: 0 20px;
    }

    .navbar {
        padding: 0 20px;
    }

    .menu-toggle {
        display: block;
    }

    .nav-links {
        position: absolute;
        top: 90px;
        left: 0;
        width: 100%;

        padding: 16px;

        display: flex;
        flex-direction: column;
        align-items: stretch;

        background: rgba(237,235,221,0.97);
        backdrop-filter: blur(25px);

        border: 1px solid var(--border);
        border-radius: 16px;

        box-shadow: 0 15px 35px rgba(27,23,23,0.1);

        opacity: 0;
        visibility: hidden;
        transform: translateY(-12px);

        transition: 0.3s ease;
    }

    .nav-links.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .nav-links a {
        padding: 15px;
    }

    .nav-links a::after {
        left: 15px;
        right: auto;
        width: 25px;
        bottom: 8px;
    }

    .nav-actions {
        display: none;
    }
}

@media(max-width: 480px) {

    .nav-wrapper {
        top: 14px;
        padding: 0 13px;
    }

    .navbar {
        height: 66px;
        padding: 0 15px;
    }

    .logo {
        font-size: 20px;
    }

    .logo-icon {
        width: 33px;
        height: 33px;
    }

    .nav-links {
        top: 77px;
    }

    .hero h1 {
        letter-spacing: -2px;
    }

    .hero p {
        font-size: 14px;
    }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<header class="nav-wrapper">

    <nav class="navbar" id="navbar">

        <!-- LOGO -->

        <a href="#home" class="logo">
            <span class="logo-icon">✳</span>
            NOVA.
        </a>

        <!-- NAVIGATION -->

        <ul class="nav-links" id="navLinks">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <!-- ACTIONS -->

        <div class="nav-actions">
            <a href="#login" class="login">Log in</a>

            <a href="#contact" class="cta">
                Let's Talk
                <span>↗</span>
            </a>
        </div>

        <!-- MOBILE MENU -->

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Toggle navigation"
            aria-expanded="false">
            ☰
        </button>

    </nav>

</header>

<!-- DEMO HERO -->

<main class="hero" id="home">

    <div class="hero-tag">
        ✳ &nbsp; DESIGN WITH PURPOSE
    </div>

    <h1>
        Less noise.<br>
        <span>More meaning.</span>
    </h1>

    <p>
        A thoughtful approach to digital experiences.
        Where timeless aesthetics meet modern creativity
        and every detail has a purpose.
    </p>

    <a href="#about" class="hero-link">
        Explore our world ↗
    </a>

</main>

<script>

const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
const navbar = document.getElementById("navbar");

// Mobile navigation

menuToggle.addEventListener("click", () => {

    const isOpen = navLinks.classList.toggle("show");

    menuToggle.textContent = isOpen ? "✕" : "☰";

    menuToggle.setAttribute(
        "aria-expanded",
        isOpen
    );

});

// Active navigation link

document.querySelectorAll(".nav-links a").forEach(link => {

    link.addEventListener("click", () => {

        document.querySelector(".nav-links a.active")
            ?.classList.remove("active");

        link.classList.add("active");

        navLinks.classList.remove("show");

        menuToggle.textContent = "☰";

        menuToggle.setAttribute("aria-expanded", "false");

    });

});

// Navbar scroll effect

window.addEventListener("scroll", () => {

    navbar.classList.toggle(
        "scrolled",
        window.scrollY > 40
    );

});

</script>

</body>
</html>
