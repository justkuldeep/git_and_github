
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Navbar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --glass: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.16);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.65);
    --accent: #8b9cff;
}

body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at 15% 20%, #493c9c 0%, transparent 40%),
        radial-gradient(ellipse at 85% 75%, #145c80 0%, transparent 40%),
        linear-gradient(135deg, #090d1c, #10182e 55%, #080c18);
    overflow-x: hidden;
}

/* Background decoration */

.orb {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.3;
    pointer-events: none;
    animation: float 9s ease-in-out infinite alternate;
}

.orb.one {
    background: #7659ff;
    top: 20%;
    left: -120px;
}

.orb.two {
    background: #00c8ff;
    bottom: -100px;
    right: -100px;
    animation-delay: -4s;
}

@keyframes float {
    to {
        transform: translate(60px, -50px);
    }
}

/* Navbar */

.nav-wrapper {
    position: fixed;
    top: 28px;
    left: 0;
    width: 100%;
    padding: 0 5%;
    z-index: 100;
}

.navbar {
    max-width: 1250px;
    height: 76px;
    margin: auto;
    padding: 0 25px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(255,255,255,0.075);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);

    border: 1px solid var(--border);
    border-radius: 22px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.15);

    transition: all 0.35s ease;
}

/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    color: white;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.8px;
}

.logo-icon {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #9c8cff, #4d9fff);
    box-shadow: 0 0 22px rgba(112,125,255,0.4);
    font-size: 19px;
}

/* Navigation links */

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
}

.nav-links a {
    position: relative;
    display: flex;
    align-items: center;
    padding: 11px 17px;

    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;

    border-radius: 12px;
    transition: all 0.3s ease;
}

/* Hover effect */

.nav-links a:hover {
    color: white;
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
}

/* Active link */

.nav-links a.active {
    color: white;
    background: rgba(255,255,255,0.12);
}

.nav-links a.active::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 3px;
    border-radius: 10px;
    background: #9eacff;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px #8296ff;
}

/* Right action */

.nav-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.login {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: 0.3s;
}

.login:hover {
    color: #aabaff;
}

.cta {
    padding: 12px 21px;
    border-radius: 12px;
    text-decoration: none;
    color: #11172a;
    font-size: 13px;
    font-weight: 700;

    background: linear-gradient(135deg, #c5caff, #8dbbff);
    box-shadow: 0 5px 20px rgba(110,145,255,0.2);
    transition: all 0.3s ease;
}

.cta:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(110,145,255,0.4);
}

/* Mobile menu */

.menu-toggle {
    display: none;
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 22px;
    cursor: pointer;
}

/* Hero */

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 120px 20px 60px;
}

.hero-tag {
    padding: 9px 17px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: var(--glass);
    color: #c4ccff;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 82px);
    font-weight: 800;
    letter-spacing: -4px;
    line-height: 1.08;
}

.hero h1 span {
    background: linear-gradient(90deg, #a9aaff, #7cceff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    max-width: 530px;
    margin-top: 22px;
    color: var(--muted);
    line-height: 1.8;
    font-size: 15px;
}

/* Responsive */

@media (max-width: 850px) {
    .nav-wrapper {
        padding: 0 18px;
    }

    .navbar {
        padding: 0 17px;
    }

    .menu-toggle {
        display: block;
    }

    .nav-links {
        position: absolute;
        top: 88px;
        left: 0;
        width: 100%;
        padding: 15px;

        flex-direction: column;
        align-items: stretch;
        gap: 5px;

        background: rgba(18,24,45,0.92);
        backdrop-filter: blur(25px);
        border: 1px solid var(--border);
        border-radius: 20px;

        opacity: 0;
        visibility: hidden;
        transform: translateY(-12px);
        transition: 0.3s ease;
    }

    .nav-links.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .nav-links a {
        padding: 14px;
    }

    .nav-links a.active::after {
        left: 15px;
        transform: none;
        bottom: 7px;
    }

    .nav-actions {
        display: none;
    }
}

@media (max-width: 480px) {
    .nav-wrapper {
        top: 15px;
    }

    .navbar {
        height: 66px;
    }

    .logo {
        font-size: 18px;
    }

    .hero h1 {
        letter-spacing: -2px;
    }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<header class="nav-wrapper">
    <nav class="navbar">

        <a href="#" class="logo">
            <span class="logo-icon">✦</span>
            NOVA.
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <div class="nav-actions">
            <a href="#" class="login">Log in</a>
            <a href="#" class="cta">Get Started ↗</a>
        </div>

        <button class="menu-toggle" id="menuToggle"
                aria-label="Toggle navigation"
                aria-expanded="false">
            ☰
        </button>

    </nav>
</header>

<main class="hero">
    <div class="hero-tag">✦ DESIGN BEYOND LIMITS</div>

    <h1>Beyond the <br>
        <span>Ordinary.</span>
    </h1>

    <p>
        Experience a new dimension of digital design.
        Minimal aesthetics, beautiful interactions and
        a touch of glassmorphism.
    </p>
</main>

<script>
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");

menuToggle.addEventListener("click", () => {
    const isOpen = navLinks.classList.toggle("show");

    menuToggle.textContent = isOpen ? "✕" : "☰";
    menuToggle.setAttribute("aria-expanded", isOpen);
});

document.querySelectorAll(".nav-links a").forEach(link => {
    link.addEventListener("click", () => {
        document.querySelector(".nav-links a.active")
            ?.classList.remove("active");

        link.classList.add("active");
        navLinks.classList.remove("show");

        menuToggle.textContent = "☰";
        menuToggle.setAttribute("aria-expanded", "false");
    });
});
</script>

</body>
</html>
